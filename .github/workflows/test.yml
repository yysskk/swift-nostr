name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# A push to a PR supersedes the in-flight run for the same ref, so cancel it
# instead of finishing the whole matrix. Runs on main are never cancelled.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  format:
    runs-on: ubuntu-latest
    container: swift:6.3
    steps:
      - uses: actions/checkout@v7

      - name: Show Swift version
        run: swift --version

      - name: Lint formatting
        run: swift format lint --strict --recursive --parallel Sources Tests Package.swift

  test:
    runs-on: ubuntu-latest
    container: swift:6.3
    steps:
      - uses: actions/checkout@v7

      - name: Show Swift version
        id: swift
        run: |
          swift --version
          echo "key=$(swift --version 2>&1 | cksum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # Key the cache on both the Swift toolchain and the manifest, so a
      # compiler change never restores a .build produced by a different
      # compiler. Package.resolved is intentionally not committed, so the
      # manifest is the best dependency key; restore-keys reuses the newest
      # same-toolchain cache after a dependency change and SwiftPM rebuilds
      # only what changed.
      - name: Cache SwiftPM build
        uses: actions/cache@v6
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ steps.swift.outputs.key }}-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-${{ steps.swift.outputs.key }}-

      # -warnings-as-errors keeps the package's own targets warning-free
      # (test targets included, via swift test). SwiftPM builds dependency
      # packages with their warnings suppressed, so upstream releases cannot
      # fail the build.
      - name: Build
        run: swift build -Xswiftc -warnings-as-errors

      - name: Run tests
        run: swift test -Xswiftc -warnings-as-errors

  test-macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Swift version
        id: swift
        run: |
          swift --version
          echo "key=$(swift --version 2>&1 | cksum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # The macOS toolchain floats with latest-stable Xcode, so include the
      # compiler version in the key: a GitHub-side Xcode bump must not restore
      # a .build produced by the previous compiler.
      - name: Cache SwiftPM build
        uses: actions/cache@v6
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ steps.swift.outputs.key }}-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-${{ steps.swift.outputs.key }}-

      # Same strictness as the Linux job; see the comment there.
      - name: Build
        run: swift build -Xswiftc -warnings-as-errors

      - name: Run tests with code coverage
        run: swift test --enable-code-coverage -Xswiftc -warnings-as-errors

      - name: Export coverage report
        run: |
          BIN_PATH="$(swift build --show-bin-path)"
          XCTEST="$(find "$BIN_PATH" -name '*.xctest' | head -1)"
          PROF_DATA="$(find "$BIN_PATH" -name 'default.profdata' | head -1)"
          xcrun llvm-cov export \
            "$XCTEST/Contents/MacOS/$(basename "$XCTEST" .xctest)" \
            --instr-profile "$PROF_DATA" \
            --ignore-filename-regex='(Tests|\.build)/.*' \
            --format=lcov > coverage.lcov
          xcrun llvm-cov report \
            "$XCTEST/Contents/MacOS/$(basename "$XCTEST" .xctest)" \
            --instr-profile "$PROF_DATA" \
            --ignore-filename-regex='(Tests|\.build)/.*'

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: coverage.lcov

  build-apple-platforms:
    name: Build (${{ matrix.platform }})
    runs-on: macos-26
    strategy:
      # Report every platform independently instead of stopping at the first failure.
      fail-fast: false
      matrix:
        platform:
          - iOS
          - tvOS
          - watchOS
          - visionOS
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Swift version
        run: swift --version

      # Compile both library products for each Apple platform to catch
      # platform-specific build breakages the macOS and Linux jobs cannot.
      # A generic device destination builds the libraries without a simulator
      # runtime or code signing, and the skip flags keep the build
      # non-interactive for the secp256k1 build-tool plugin.
      - name: Build for ${{ matrix.platform }}
        run: |
          xcodebuild build \
            -scheme swift-nostr-Package \
            -destination 'generic/platform=${{ matrix.platform }}' \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            -quiet

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build for Android
        uses: skiptools/swift-android-action@2044b79660f201ccef8cbce62877e4ec5409f9c8 # v2.9.5
        with:
          swift-version: "6.3"
          run-tests: false
